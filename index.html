<!doctype html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8f2" />
    <meta name="description" content="Timer për 3 raunde frymëmarrjeje, mbajtjeje dhe pushimi. Udhëzime në shqip, numërim zanor dhe pamje e çelët ose e errët." />
    <script>
      // Apply the saved/system theme before the first paint, including offline visits.
      (() => {
        let saved;
        try { saved = localStorage.getItem('breathwork.theme'); } catch {}
        const theme = saved === 'dark' || saved === 'light' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#141d19' : '#f7f8f2';
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Breathwork — Fokus te frymëmarrja</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
